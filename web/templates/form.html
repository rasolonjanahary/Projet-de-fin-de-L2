<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admission predict form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow-lg p-4 rounded-4">
      <h2 class="text-center mb-4">Admission predict</h2>
      <form action="/predict" method="post" class="row g-3">
        
        <div class="col-md-6">
          <label class="form-label">Graduate Record Examination Score (260-340 ou 'aucun')</label>
          <input type="number" name="GRE_Score" min="260" max="340" class="form-control" required>
        </div>
        
        <div class="col-md-6">
          <label class="form-label">Test of English as a Foreign Language Score (0-120 ou 'aucun')</label>
          <input type="number" name="TOEFL_Score" min="0" max="120"class="form-control" required>
        </div>
        
        <div class="col-md-6">
          <label class="form-label">University Rating (1 à 5 ou 'aucun')</label>
          <input type="number" name="University_Rating" min="1" max="5" class="form-control" required>
        </div>
        
        <div class="col-md-6">
          <label class="form-label">Statement of Purpose (0.0 à 5.0 ou 'aucun')</label>
          <input type="text" name="SOP" class="form-control" min="0.0" max="5.0" placeholder="Ex: 3.5" required>
        </div>
        
        <div class="col-md-6">
          <label class="form-label">Letter of Recommendation (0.0 à 5.0 ou 'aucun')</label>
          <input type="text" name="LOR" class="form-control" min="0.0" max="5.0" placeholder="Ex: 4.0" required>
        </div>
        
        <div class="col-md-6">
          <label class="form-label">Cumulative Grade Point Average (Sur 10 ou 'aucun')</label>
          <input type="text" name="CGPA" class="form-control" min="0.0" max="10.0" placeholder="Ex: 9.2" required>
        </div>
        
        <div class="col-md-6">
          <label class="form-label">Research (Yes / No)</label>
          <select name="Research" class="form-select" required>
            <option value="">-- Choice --</option>
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </div>
        
        <div class="col-12 text-center mt-4">
          <button type="submit" class="btn btn-primary btn-lg px-4">Predict</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
