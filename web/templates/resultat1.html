<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Résultat de prédiction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow-lg p-4 rounded-4 text-center">
      <h2 class="mb-4 text-primary">Résultat de prédiction</h2>
      
      <p class="fs-5">
        Chance d'admission: vous avez
        <span class="fw-bold text-success">{{ prediction }} %</span> de chance d'être admis
        and  
        <span class="fw-bold text-warning">{{ prediction_c }} %</span> non admis.
      </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
